[package]
name = "local-search"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "veda"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive", "env"] }
docling = { version = "1.44.0", default-features = false, features = ["pdf", "vlm", "chunking"], optional = true }
docling-core = { version = "1.44.0", optional = true }
docling-onnx = { version = "1.44.0", optional = true }
docling-pdf = { version = "1.44.0", default-features = false, features = ["ml"], optional = true }
dotenvy = "0.15.7"
hex = "0.4.3"
image = { version = "0.25", optional = true }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlite-vec = "0.1.9"
thiserror = "2.0.20"
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal", "net", "process", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[features]
# The default build wires the full local workflow — docling extraction (PDF/
# DOCX/PNG with ONNX OCR), the in-process ONNX text embedder, and the CUDA
# execution provider. CUDA is attempted first at runtime and falls back to CPU
# per session when unavailable (DOCLING_RS_EP defaults to `auto`).
default = ["docling-extract", "onnx-embed", "image-embed", "cuda"]
# docling.rs extraction: local ONNX pipeline, plus the optional remote VLM path.
docling-extract = ["dep:docling", "dep:docling-onnx", "dep:docling-pdf", "dep:ort"]
# In-process ONNX sentence encoder for LS_EMBED_PROVIDER=onnx.
onnx-embed = ["dep:ort", "dep:tokenizers", "dep:docling-core", "dep:docling-onnx"]
# In-process ONNX image/text encoder for LS_IMAGE_EMBED_PROVIDER=siglip.
image-embed = ["dep:ort", "dep:tokenizers", "dep:docling-core", "dep:docling-onnx", "dep:image"]
# CUDA execution provider for every ONNX session (docling + the embedder).
# Requires CUDA 12 + cuDNN 9 at runtime; missing libraries fall back to CPU.
cuda = ["docling?/cuda", "docling-onnx?/cuda", "docling-pdf?/cuda"]

# Test helpers (not product surface) — need the docling crate.
[[example]]
name = "rasterize"
required-features = ["docling-extract"]

[[example]]
name = "docling_dump"
required-features = ["docling-extract"]

[[example]]
name = "siglip_probe"
required-features = ["image-embed"]

[dev-dependencies]
# Drive the axum router in-process (versions already in the dependency graph).
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Vendored docling-onnx with a CUDA memory patch (see vendor/docling-onnx):
# memory-friendly cuDNN conv search and arena growth, overridable via
# DOCLING_RS_CUDA_* env vars, plus shared run options with CUDA
# memory-arena shrinkage (DOCLING_RS_CUDA_ARENA_SHRINK) so session-reuse
# across an ingest batch stops ratcheting reserved VRAM. Remove this to
# track upstream.
[patch.crates-io]
docling-onnx = { path = "vendor/docling-onnx" }
# Same patch series, run-options side: every ONNX inference call in
# docling-pdf runs through docling-onnx::shrink_run_options().
docling-pdf = { path = "vendor/docling-pdf" }
